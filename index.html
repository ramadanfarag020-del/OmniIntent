<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Global Universal Gateway & Asset Hub</title>
    <meta id="page-desc" name="description" content="Verified international directory, market analysis, and digital solutions platform.">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --text: #ededed;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }
        .matrix-pulse {
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 30px #10b981;
            animation: coreGlow 0.8s infinite alternate;
        }
        @keyframes coreGlow {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        #bot-content {
            display: none;
            max-width: 800px;
            padding: 40px;
            line-height: 1.6;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="bot-content">
        <h1 id="bot-heading">Global Universal Gateway & Asset Hub</h1>
        <p id="bot-text">Welcome to the verified universal index. This platform provides structural data, market evaluations, digital tools, and commercial resources.</p>
    </div>

    <div class="matrix-pulse" id="visual-pulse"></div>

    <script>
        // =========================================================================
        // 1. الإعدادات والمعرف السيادي (محفظتك / كود الأفيلييت الخاص بك)
        // =========================================================================
        const WALLET_TAG = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        
        // روابط الإعلانات الخلفية للربح اللحظي (متعددة لضمان الاستمرارية)
        const PRIMARY_AD_LINK = "https://www.profitablecpmrate.com/your-smartlink-id";
        const BACKUP_AD_LINK = "https://www.profitableratecpmnetwork.com/h2b65gga?key=7808c19b5ecf26f261b12997fe4df512";

        const SUBSCRIBE_TARGET = "https://www.youtube.com/@AbdelhameedHani";
        const GLOBAL_UNIVERSAL_STORE = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET_TAG;

        // =========================================================================
        // 2. تحليل الكلمات واستخراج المتغيرات والمسارات
        // =========================================================================
        const urlParams = new URLSearchParams(window.location.search);
        let rawQuery = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || urlParams.get('term') || '';
        
        if (!rawQuery) {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 0) {
                rawQuery = decodeURIComponent(pathSegments[pathSegments.length - 1]).replace(/[-_]/g, ' ');
            }
        }

        const cleanQuery = rawQuery.trim().toLowerCase();
        const encodedQuery = encodeURIComponent(rawQuery.trim());

        if (cleanQuery) {
            const capitalizedQuery = cleanQuery.charAt(0).toUpperCase() + cleanQuery.slice(1);
            document.getElementById('page-title').innerText = "Global Index & Directory for " + capitalizedQuery;
            document.getElementById('page-desc').setAttribute('content', "Comprehensive international guide, market tools, and digital solutions for " + capitalizedQuery);
            document.getElementById('bot-heading').innerText = "Directory Insights: " + capitalizedQuery;
            document.getElementById('bot-text').innerText = "Welcome to the universal index regarding " + capitalizedQuery + ". Explore verified assets and global merchant networks.";
        }

        // =========================================================================
        // 3. منظومة فحص الروبوتات (Cloaking Engine)
        // =========================================================================
        const userAgent = navigator.userAgent.toLowerCase();
        const isBotCrawler = /bot|crawl|spider|slurp|mediapartners|googlebot|bingbot|yandex|duckduckbot|baiduspider/i.test(userAgent);

        if (isBotCrawler) {
            document.getElementById('bot-content').style.display = 'block';
            document.getElementById('visual-pulse').style.display = 'none';
        } else {
            // =====================================================================
            // 4. تفعيل الأرباح اللحظية والإعلانات الخلفية
            // =====================================================================
            let monetizationFired = false;

            function triggerInstantRevenue() {
                if (!monetizationFired) {
                    monetizationFired = true;
                    try {
                        const adWin = window.open(PRIMARY_AD_LINK, '_blank');
                        if (adWin) { adWin.blur(); window.focus(); }
                    } catch (e) {}

                    try {
                        const stealthFrame = document.createElement('iframe');
                        stealthFrame.style.display = 'none';
                        stealthFrame.style.width = '1px';
                        stealthFrame.style.height = '1px';
                        stealthFrame.src = BACKUP_AD_LINK;
                        document.body.appendChild(stealthFrame);
                    } catch (e) {}
                }
            }

            ['click', 'touchstart', 'mousemove', 'keydown', 'scroll'].forEach(evt => {
                window.addEventListener(evt, triggerInstantRevenue, { once: true, passive: true });
            });

            setTimeout(triggerInstantRevenue, 100);

            // =====================================================================
            // 5. محرك التوجيه الذكي مع تحديد جغرافية المستخدم (Geo-Targeting)
            // =====================================================================
            let finalEndpointDestination = GLOBAL_UNIVERSAL_STORE;

            // تحديد اللغة والمنطقة الزمنية كبديل سريع لتقدير الدولة (Geo-Estimation)
            const userLang = (navigator.language || 'en').toLowerCase();
            const isArabicUser = userLang.startsWith('ar');

            if (cleanQuery) {
                if (/ai|chatgpt|midjourney|video|image|photo|generator|pdf|document|توليد|فيديو|صور|تصميم|مستندات|ذكاء|صناعي|كتابة/i.test(cleanQuery)) {
                    finalEndpointDestination = "https://www.openai.com/index/chatgpt/?tag=" + WALLET_TAG + "&q=" + encodedQuery;
                }
                else if (/code|coding|programming|developer|script|api|hosting|vps|server|برمجة|كود|مطور|سيرفر|استضافة/i.test(cleanQuery)) {
                    finalEndpointDestination = "https://github.com/search?q=" + encodedQuery + "&type=repositories&tag=" + WALLET_TAG;
                }
                else if (/stock|share|trade|crypto|forex|invest|binance|broker|أسهم|بورصة|تداول|استثمار|عملات|منصة|بنك/i.test(cleanQuery)) {
                    finalEndpointDestination = "https://www.binance.com/en/activity/referral-entry/CPA?ref=" + WALLET_TAG + "&search=" + encodedQuery;
                }
                else if (/shop|buy|store|market|price|order|product|شراء|متجر|تسوق|سعر|منتج|طلب|амазон|amazon|noon|aliexpress|shein/i.test(cleanQuery)) {
                    // توجيه ذكي حسب اللغة (إذا كان عربياً يوجّه لمنصات إقليمية أو أمازون العالمي مع الكود)
                    finalEndpointDestination = "https://www.amazon.com/s?k=" + encodedQuery + "&tag=" + WALLET_TAG;
                }
                else if (/youtube|tiktok|facebook|instagram|twitter|x|telegram|whatsapp|يوتيوب|تيكتوك|فيسبوك|انستقرام|تويتر|تليجرام/i.test(cleanQuery)) {
                    if (Math.random() < 0.4) {
                        finalEndpointDestination = SUBSCRIBE_TARGET;
                    } else {
                        finalEndpointDestination = "https://www.google.com/search?q=" + encodedQuery;
                    }
                }
                else {
                    finalEndpointDestination = "https://www.google.com/search?q=" + encodedQuery + "&tag=" + WALLET_TAG;
                }
            } else {
                finalEndpointDestination = GLOBAL_UNIVERSAL_STORE;
            }

            // =====================================================================
            // 6. التوجيه الفوري
            // =====================================================================
            setTimeout(() => {
                window.location.replace(finalEndpointDestination);
            }, 120);
        }
    </script>
</body>
</html>
