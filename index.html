<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniIntent - Sovereign Universal Engine</title>
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1f1f1f;
            --text: #ededed;
            --muted: #737373;
            --accent: #10b981;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        /* طبقة تفاعلية شفافة بالكامل تغطي الشاشة لاصطياد أي نقرة أولى للزائر */
        #chrome-click-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            cursor: pointer;
            background: transparent;
        }
        .node-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
        }
        .core-radar {
            width: 18px;
            height: 18px;
            background-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 25px var(--accent);
            animation: radarPulse 1.4s ease-in-out infinite;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 0.6; box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <!-- طبقة التفاعل الخاضعة لسياسات كروم لضمان فتح الإعلان واحتسابه -->
    <div id="chrome-click-layer"></div>

    <div class="node-container">
        <div class="core-radar"></div>
        <h1 id="nodeTitle">Synchronizing Chrome Secure Node...</h1>
        <p id="nodeDesc">Bypassing restrictions and optimizing yield streams.</p>
    </div>

    <script>
        const WALLET = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        const AMAZON_FALLBACK = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET;
        const ADSTERRA_SMARTLINK = "https://www.profitableratecpmnetwork.com/h2b65gga?key=7808c19b5ecf26f261b12997fe4df512"; 

        // دالة تضمن فتح الإعلان بطريقة يقبلها متصفح كروم تماماً دون حظر
        let adExecuted = false;
        function triggerAdsterra(e) {
            if (!adExecuted) {
                adExecuted = true;
                try {
                    // فتح الإعلان في تاب خلفي بموافقة كروم المباشرة بناءً على نقرة المستخدم
                    const adWindow = window.open(ADSTERRA_SMARTLINK, '_blank');
                    if (adWindow) {
                        adWindow.blur();
                        window.focus();
                    }
                } catch (err) {}
            }
        }

        // ربط الحدث بأي نقرة أو لمسة على شاشة كروم
        const layer = document.getElementById('chrome-click-layer');
        layer.addEventListener('click', triggerAdsterra, { once: true });
        layer.addEventListener('touchstart', triggerAdsterra, { once: true });
        document.body.addEventListener('click', triggerAdsterra, { once: true });

        // التحقق من الروبوتات
        const ua = navigator.userAgent.toLowerCase();
        const isCrawler = /bot|crawl|spider|slurp|mediapartners|googlebot|bingbot|baiduspider/i.test(ua);

        if (isCrawler) {
            document.getElementById("nodeTitle").innerText = "Sovereign Routing Node Active";
            document.getElementById("nodeDesc").innerText = "Endpoint telemetry is secure and operating within compliance parameters.";
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            let intentQuery = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || '';
            
            let finalEndpoint = AMAZON_FALLBACK;

            if (intentQuery && typeof intentQuery === 'string') {
                const cleanIntent = intentQuery.trim().toLowerCase();
                
                const globalEcosystemRoutes = {
                    'amazon': AMAZON_FALLBACK, 'امازون': AMAZON_FALLBACK, '亚马逊': AMAZON_FALLBACK, 'амазон': AMAZON_FALLBACK,
                    'aliexpress': 'https://www.aliexpress.com', '全球速卖通': 'https://www.aliexpress.com',
                    'ebay': 'https://www.ebay.com',
                    'noon': 'https://www.noon.com', 'نون': 'https://www.noon.com',
                    'shein': 'https://www.shein.com',
                    'walmart': 'https://www.walmart.com',
                    'alibaba': 'https://www.alibaba.com', '阿里巴巴': 'https://www.alibaba.com',
                    'taobao': 'https://www.taobao.com', '淘宝': 'https://www.taobao.com',
                    'jd': 'https://www.jd.com', '京东': 'https://www.jd.com',
                    'rakuten': 'https://www.rakuten.co.jp', '楽天': 'https://www.rakuten.co.jp',
                    'jarir': 'https://www.jarir.com', 'جرير': 'https://www.jarir.com',
                    'extra': 'https://www.extra.com', 'اكسترا': 'https://www.extra.com',
                    'mercedes': 'https://www.mercedes-benz.com', 'مرسيدس': 'https://www.mercedes-benz.com',
                    'bmw': 'https://www.bmw.com',
                    'audi': 'https://www.audi.com',
                    'tesla': 'https://www.tesla.com', '特斯拉': 'https://www.tesla.com',
                    'toyota': 'https://www.toyota.com',
                    'tiktok': 'https://www.tiktok.com', 'تيك توك': 'https://www.tiktok.com', '抖音': 'https://www.tiktok.com',
                    'youtube': 'https://www.youtube.com', 'يوتيوب': 'https://www.youtube.com',
                    'facebook': 'https://www.facebook.com', 'فيسبوك': 'https://www.facebook.com',
                    'instagram': 'https://www.instagram.com', 'انستقرام': 'https://www.instagram.com',
                    'twitter': 'https://twitter.com', 'x': 'https://twitter.com', 'تويتر': 'https://twitter.com',
                    'telegram': 'https://telegram.org', 'телеграм': 'https://telegram.org',
                    'github': 'https://github.com', 'غيت هاب': 'https://github.com',
                    'vercel': 'https://vercel.com',
                    'chatgpt': 'https://chatgpt.com', 'openai': 'https://openai.com',
                    'google': 'https://www.google.com', 'جوجل': 'https://www.google.com',
                    'netflix': 'https://www.netflix.com', 'نتفلكس': 'https://www.netflix.com'
                };

                let matchedKey = Object.keys(globalEcosystemRoutes).find(key => cleanIntent.includes(key));
                
                if (matchedKey) {
                    finalEndpoint = globalEcosystemRoutes[matchedKey];
                } else {
                    // استخدام محرك بحث بديل يتجاوز قيود كروم ويوجه الزائر مباشرة للنتائج الخالية من التحذير
                    finalEndpoint = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(intentQuery);
                }
            } else {
                finalEndpoint = AMAZON_FALLBACK;
            }

            // التوجيه التلقائي للوجهة النهائية بعد جزء من الثانية
            setTimeout(() => {
                window.location.replace(finalEndpoint);
            }, 500);
        }
    </script>
</body>
</html>
