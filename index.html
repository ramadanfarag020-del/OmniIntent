<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Direct Redirector</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #click-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- طبقة التفاعل لضمان فتح إعلان Adsterra في كروم دون حظر -->
    <div id="click-layer"></div>

    <div>
        <h2>Redirecting to Destination...</h2>
    </div>

    <script>
        const WALLET = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        const DEFAULT_TARGET = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET;
        const ADSTERRA_LINK = "https://www.profitableratecpmnetwork.com/h2b65gga?key=7808c19b5ecf26f261b12997fe4df512"; 

        // تنفيذ إعلان Adsterra عند أول تفاعل بشري على الشاشة
        let adDone = false;
        function fireAd() {
            if (!adDone) {
                adDone = true;
                try {
                    const w = window.open(ADSTERRA_LINK, '_blank');
                    if (w) { w.blur(); window.focus(); }
                } catch (e) {}
            }
        }

        const layer = document.getElementById('click-layer');
        layer.addEventListener('click', fireAd);
        layer.addEventListener('touchstart', fireAd);
        document.body.addEventListener('click', fireAd);

        // قراءة المتغيرات من الرابط
        const params = new URLSearchParams(window.location.search);
        let query = params.get('q') || params.get('query') || params.get('search') || params.get('keyword') || params.get('s') || '';
        
        let targetUrl = DEFAULT_TARGET;

        if (query) {
            let cleanQuery = query.trim().toLowerCase();
            
            // جدول الكلمات والتوجيهات المباشرة (عدّل أو أضف ما تشاء هنا)
            const routes = {
                'بسام': 'https://www.instagram.com/bassam.78',
                'يوتيوب': 'https://www.youtube.com',
                'youtube': 'https://www.youtube.com',
                'انستقرام': 'https://www.instagram.com',
                'instagram': 'https://www.instagram.com'
            };

            // التحقق مما إذا كانت الكلمة موجودة في الجدول
            let foundKey = Object.keys(routes).find(k => cleanQuery.includes(k));
            
            if (foundKey) {
                targetUrl = routes[foundKey];
            } else {
                // إذا لم تكن موجودة، يتم توجيهه للموقع الافتراضي مباشرة ودون أي بحث نهائياً
                targetUrl = DEFAULT_TARGET;
            }
        }

        // التوجيه الفوري للهدف خلال أجزاء من الثانية دون فتح أي محرك بحث
        setTimeout(() => {
            window.location.replace(targetUrl);
        }, 300);
    </script>
</body>
</html>
