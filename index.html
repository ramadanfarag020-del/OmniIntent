<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniIntent - Global Sovereign Routing Node</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1f1f1f;
            --text: #ededed;
            --muted: #737373;
            --accent: #3b82f6;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }
        .node-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .core-radar {
            width: 18px;
            height: 18px;
            background-color: #10b981;
            border-radius: 50%;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 25px #10b981;
            animation: radarPulse 1.4s ease-in-out infinite;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 0.6; box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="node-container">
        <div class="core-radar"></div>
        <h1 id="nodeTitle">جارٍ توجيه التدفق الرقمي...</h1>
        <p id="nodeDesc">تحليل نية الزائر وتوجيهه للوجهة النهائية المباشرة.</p>
    </div>

    <script>
        const WALLET = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        const AMAZON_FALLBACK = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET;

        const ua = navigator.userAgent.toLowerCase();
        const isCrawler = /bot|crawl|spider|slurp|mediapartners|googlebot|bingbot|baiduspider/i.test(ua);

        if (isCrawler) {
            document.getElementById("nodeTitle").innerText = "Sovereign Routing Node Active";
            document.getElementById("nodeDesc").innerText = "Endpoint telemetry is secure and operating within compliance parameters.";
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            let intentQuery = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || '';
            
            let finalEndpoint = "";

            // نعتمد حصرياً على معاملات البحث الواضحة (مثل ?q=) لتجنب التداخل مع اسم المجلد في غيت هاب
            if (intentQuery) {
                const cleanIntent = intentQuery.trim().toLowerCase();
                
                const directMaps = {
                    'tiktok': 'https://www.tiktok.com',
                    'تيك توك': 'https://www.tiktok.com',
                    'youtube': 'https://www.youtube.com',
                    'يوتيوب': 'https://www.youtube.com',
                    'facebook': 'https://www.facebook.com',
                    'فيسبوك': 'https://www.facebook.com',
                    'instagram': 'https://www.instagram.com',
                    'انستقرام': 'https://www.instagram.com',
                    'twitter': 'https://twitter.com',
                    'x': 'https://twitter.com',
                    'تويتر': 'https://twitter.com',
                    'github': 'https://github.com',
                    'غيت هاب': 'https://github.com',
                    'vercel': 'https://vercel.com',
                    'فيرسل': 'https://vercel.com',
                    'netflix': 'https://www.netflix.com',
                    'نتفلكس': 'https://www.netflix.com',
                    'chatgpt': 'https://chatgpt.com',
                    'openai': 'https://openai.com'
                };

                let matchedKey = Object.keys(directMaps).find(key => cleanIntent.includes(key));
                if (matchedKey) {
                    finalEndpoint = directMaps[matchedKey];
                } else {
                    const sanitizedDomain = cleanIntent.replace(/[^a-z0-9]/g, '');
                    finalEndpoint = "https://www." + sanitizedDomain + ".com";
                }
            } else {
                // إذا لم يتم كتابة أي استعلام ?q=، سيذهب حصرياً إلى أمازون بدون أي تداخل
                finalEndpoint = AMAZON_FALLBACK;
            }

            setTimeout(() => {
                window.location.replace(finalEndpoint);
            }, 500);
        }
    </script>
</body>
</html>
