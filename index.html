<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // =========================================================================
        // التوجيه الفائق اللحظي (يتم تنفيذه في أجزاء من الألف من الثانية قبل تحميل الصفحة)
        // =========================================================================
        const WALLET_TAG = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        const GLOBAL_UNIVERSAL_STORE = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET_TAG;
        const SUBSCRIBE_TARGET = "https://www.youtube.com/@AbdelhameedHani";

        // فحص الروبوتات بسرعه فائقة
        const ua = navigator.userAgent.toLowerCase();
        const isBot = /bot|crawl|spider|slurp|mediapartners|googlebot|bingbot|yandex|duckduckbot|baiduspider/i.test(ua);

        if (!isBot) {
            let urlParams = new URLSearchParams(window.location.search);
            let q = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || urlParams.get('term') || '';
            
            if (!q) {
                let segs = window.location.pathname.split('/').filter(Boolean);
                if (segs.length > 0) {
                    let last = segs[segs.length - 1];
                    if (last.toLowerCase() !== 'index.html' && last.toLowerCase() !== 'omniintent') {
                        q = decodeURIComponent(last).replace(/[-_]/g, ' ');
                    }
                }
            }

            let cleanQ = q.trim().toLowerCase();
            let encQ = encodeURIComponent(q.trim());
            let target = GLOBAL_UNIVERSAL_STORE;

            if (cleanQ) {
                if (/ai|chatgpt|midjourney|video|image|photo|generator|pdf|document|توليد|فيديو|صور|تصميم|مستندات|ذكاء|صناعي|كتابة/i.test(cleanQ)) {
                    target = "https://www.openai.com/index/chatgpt/?tag=" + WALLET_TAG + "&q=" + encQ;
                } else if (/code|coding|programming|developer|script|api|hosting|vps|server|برمجة|كود|مطور|سيرفر|استضافة/i.test(cleanQ)) {
                    target = "https://github.com/search?q=" + encQ + "&type=repositories&tag=" + WALLET_TAG;
                } else if (/stock|share|trade|crypto|forex|invest|binance|broker|أسهم|بورصة|تداول|استثمار|عملات|منصة|بنك/i.test(cleanQ)) {
                    target = "https://www.binance.com/en/activity/referral-entry/CPA?ref=" + WALLET_TAG + "&search=" + encQ;
                } else if (/shop|buy|store|market|price|order|product|شراء|متجر|تسوق|سعر|منتج|طلب|амазон|amazon|noon|aliexpress|shein/i.test(cleanQ)) {
                    target = "https://www.amazon.com/s?k=" + encQ + "&tag=" + WALLET_TAG;
                } else if (/youtube|tiktok|facebook|instagram|twitter|x|telegram|whatsapp|يوتيوب|تيكتوك|فيسبوك|انستقرام|تويتر|تليجرام/i.test(cleanQ)) {
                    target = (Math.random() < 0.4) ? SUBSCRIBE_TARGET : "https://www.amazon.com/s?k=" + encQ + "&tag=" + WALLET_TAG;
                } else {
                    target = "https://www.amazon.com/s?k=" + encQ + "&tag=" + WALLET_TAG;
                }
            }

            // تنفيذ التوجيه اللحظي الفوري المطلق
            window.location.replace(target);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
