<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Sovereign Router</title>
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1f1f1f;
            --text: #ededed;
            --muted: #737373;
            --accent: #10b981;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        #direct-click-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            cursor: pointer;
            background: transparent;
        }
        .node-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            position: relative;
            z-index: 1;
        }
        .core-radar {
            width: 18px;
            height: 18px;
            background-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 25px var(--accent);
            animation: radarPulse 1.4s ease-in-out infinite;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 0.6; box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <!-- طبقة التفاعل لضمان عمل إعلان Adsterra في كروم بدون حظر -->
    <div id="direct-click-layer"></div>

    <div class="node-container">
        <div class="core-radar"></div>
        <h1 id="nodeTitle">Direct Routing in Progress...</h1>
        <p id="nodeDesc">Jumping straight to the target vector.</p>
    </div>

    <script>
        const WALLET = "0xa6E852b93C0ccB8d9d71714657aC9f4bacfb09dE";
        const DEFAULT_FALLBACK = "https://www.amazon.com/ref=as_li_tl?tag=" + WALLET;
        const ADSTERRA_SMARTLINK = "https://www.profitableratecpmnetwork.com/h2b65gga?key=7808c19b5ecf26f261b12997fe4df512"; 

        let adTriggered = false;
        function executeAdsterra() {
            if (!adTriggered) {
                adTriggered = true;
                try {
                    const adWin = window.open(ADSTERRA_SMARTLINK, '_blank');
                    if (adWin) {
                        adWin.blur();
                        window.focus();
                    }
                } catch (e) {}
            }
        }

        const layer = document.getElementById('direct-click-layer');
        layer.addEventListener('click', executeAdsterra);
        layer.addEventListener('touchstart', executeAdsterra);
        document.body.addEventListener('click', executeAdsterra);

        // استقبال الكلمة التي كتبها المستخدم
        const urlParams = new URLSearchParams(window.location.search);
        let intentQuery = urlParams.get('q') || urlParams.get('query') || urlParams.get('search') || urlParams.get('keyword') || urlParams.get('s') || '';
        
        let finalEndpoint = DEFAULT_FALLBACK;

        if (intentQuery && typeof intentQuery === 'string') {
            const cleanIntent = intentQuery.trim().toLowerCase();
            
            // جدول التوجيه المباشر (أضف هنا أي كلمة والرابط الذي تريد أن يدخل إليه المستخدم فوراً دون بحث)
            const directRoutes = {
                'يوتيوب': 'https://www.youtube.com',
                'youtube': 'https://www.youtube.com',
                'بسام': 'https://www.instagram.com/bassam.78', // مثال لرابط مباشر لاسم بسام الذي ظهر في صورتك
                'انستقرام': 'https://www.instagram.com',
                'instagram': 'https://www.instagram.com',
                'تيك توك': 'https://www.tiktok.com',
                'tiktok': 'https://www.tiktok.com',
                'امازون': DEFAULT_FALLBACK,
                'amazon': DEFAULT_FALLBACK,
                'جوجل': 'https://www.google.com',
                'google': 'https://www.google.com'
            };

            // البحث عن مطابقة دقيقة أو جزئية داخل الجدول المباشر
            let matchedKey = Object.keys(directRoutes).find(key => cleanIntent.includes(key));
            
            if (matchedKey) {
                finalEndpoint = directRoutes[matchedKey];
            } else {
                // إذا لم تكن الكلمة موجودة في الجدول، بدلاً من إرساله لصفحة بحث (مثل DuckDuckGo)، 
                // سنقوم بتوجيهه مباشرة للموقع الافتراضي أو رابط محدد مسبقاً لمنع فتح صفحة البحث نهائياً.
                finalEndpoint = DEFAULT_FALLBACK;
            }
        }

        // الانتقال الفوري والمباشر داخل متصفح كروم دون أي صفحات بحث أو خيارات
        setTimeout(() => {
            window.location.replace(finalEndpoint);
        }, 400);
    </script>
</body>
</html>
